name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. سحب الكود
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. تثبيت بايثون
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. تثبيت Buildozer والمكتبات المطلوبة
      - name: Install Buildozer and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev openjdk-17-jdk unzip
          sudo apt-get install -y autoconf libtool pkg-config libncurses-dev libssl-dev libffi-dev libgdbm-dev zlib1g-dev
          pip install buildozer cython

      # 4. حل مشكلة تراخيص Android SDK (خطوة جديدة ومهمة جداً)
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license

      # 5. التخزين المؤقت
      - name: Cache Buildozer
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            buildozer.spec
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      # 6. تنفيذ أمر البناء يدوياً
      - name: Build APK
        run: buildozer android debug

      # 7. رفع ملف الـ APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: bin/*.apk
