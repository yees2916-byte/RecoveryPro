name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. سحب الكود
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. تثبيت بايثون
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. تثبيت Buildozer والمكتبات (تم إضافة --upgrade لتحديث Buildozer)
      - name: Install Buildozer and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev openjdk-17-jdk unzip
          sudo apt-get install -y autoconf libtool pkg-config libncurses-dev libssl-dev libffi-dev libgdbm-dev zlib1g-dev
          pip install --upgrade buildozer cython

      # 4. إعداد Android SDK بشكل قسري وصحيح
      - name: Setup Android SDK
        run: |
          # تحديد المسارات
          SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          
          # إنشاء المجلدات
          mkdir -p $SDK_ROOT/cmdline-tools/latest
          
          # تحميل الأدوات وفك الضغط
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $SDK_ROOT/cmdline-tools/
          
          # ترتيب الملفات
          mv $SDK_ROOT/cmdline-tools/cmdline-tools/* $SDK_ROOT/cmdline-tools/latest/
          
          # --- الحل الجذري (Symlink القسري) ---
          # سنستخدم -sf لإجبار النظام على إنشاء الرابط وتحديثه
          ln -sf $SDK_ROOT/cmdline-tools/latest $SDK_ROOT/tools
          
          # تعيين صلاحيات التنفيذ لجميع الملفات القابلة للتنفيذ داخل bin
          chmod +x $SDK_ROOT/cmdline-tools/latest/bin/*
          
          # تعيين متغيرات البيئة
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/tools/bin" >> $GITHUB_PATH

      # 5. قبول التراخيص
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses

      # 6. التخزين المؤقت (سنقوم بتضمين build-tools أيضاً للتسريع)
      - name: Cache Buildozer
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            buildozer.spec
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 7. تنفيذ أمر البناء
      - name: Build APK
        run: buildozer android debug

      # 8. رفع ملف الـ APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: bin/*.apk
