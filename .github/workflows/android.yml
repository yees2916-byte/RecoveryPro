name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. سحب الكود
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. تثبيت بايثون
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. تثبيت Buildozer والمكتبات المطلوبة
      - name: Install Buildozer and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev openjdk-17-jdk unzip
          sudo apt-get install -y autoconf libtool pkg-config libncurses-dev libssl-dev libffi-dev libgdbm-dev zlib1g-dev
          pip install buildozer cython

      # 4. تثبيت أدوات Android SDK وإنشاء الرابط الوهمي (الحل الجذري)
      - name: Setup Android SDK
        run: |
          # تحديد مسار الـ SDK
          SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          
          # إنشاء المجلدات المطلوبة
          mkdir -p $SDK_ROOT/cmdline-tools/latest
          
          # تحميل الأدوات وفك ضغطها
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline-tools.zip
          unzip /tmp/cmdline-tools.zip -d $SDK_ROOT/cmdline-tools/
          
          # ترتيب الملفات داخل latest
          mv $SDK_ROOT/cmdline-tools/cmdline-tools/* $SDK_ROOT/cmdline-tools/latest/
          
          # --- الحل الجذري (Symlink) ---
          # سنقوم بإنشاء مجلد وهمي اسمه "tools" يشير إلى "cmdline-tools/latest"
          # لأن Buildozer يصر على البحث في "tools" بينما الأندرويد يستخدم "cmdline-tools"
          ln -s $SDK_ROOT/cmdline-tools/latest $SDK_ROOT/tools
          
          # تعيين متغيرات البيئة
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/tools/bin" >> $GITHUB_PATH

      # 5. قبول التراخيص
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses

      # 6. التخزين المؤقت
      - name: Cache Buildozer
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            buildozer.spec
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      # 7. تنفيذ أمر البناء
      - name: Build APK
        run: buildozer android debug

      # 8. رفع ملف الـ APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: bin/*.apk
