name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. سحب الكود
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. تثبيت بايثون
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. تثبيت Buildozer والمكتبات المطلوبة
      - name: Install Buildozer and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev openjdk-17-jdk unzip
          sudo apt-get install -y autoconf libtool pkg-config libncurses-dev libssl-dev libffi-dev libgdbm-dev zlib1g-dev
          pip install buildozer cython

      # 4. تثبيت أدوات Android SDK يدوياً بالبنية الصحيحة (الحل للمشكلة الحالية)
      - name: Setup Android SDK
        run: |
          # إنشاء المجلدات
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          
          # تحميل الأدوات وتثبيتها
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline-tools.zip
          unzip /tmp/cmdline-tools.zip -d $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/
          
          # تصحيح البنية (يجب أن يكون الملفات داخل cmdline-tools/latest)
          mv $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools/* $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          
          # تعيين متغيرات البيئة حتى يعرف Buildozer أين يبحث
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
          echo "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      # 5. قبول التراخيص (الآن لدينا sdkmanager صحيح)
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses

      # 6. التخزين المؤقت
      - name: Cache Buildozer
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            buildozer.spec
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      # 7. تنفيذ أمر البناء
      - name: Build APK
        run: buildozer android debug

      # 8. رفع ملف الـ APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: bin/*.apk
