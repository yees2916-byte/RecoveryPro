name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. سحب الكود
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. تحديث Ruby و Bundler (مهم جداً)
      - name: Fix Ruby Environment
        run: |
          sudo gem update --system
          sudo gem install bundler
          sudo gem update bundler

      # 3. التخزين المؤقت
      - name: Cache Buildozer
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            buildozer.spec
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      # 4. بناء التطبيق (تم استخدام أداة أخرى مضمونة هنا)
      - name: Build with Buildozer
        uses: robertohuertasm/buildozer-action@master
        with:
          workdir: ${{ github.workspace }}

      # 5. رفع الملف
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: bin/*.apk
